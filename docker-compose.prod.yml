services:
  db:
    image: postgres:16-alpine
    container_name: hostelswap_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-hostel_exchange}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in production .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-hostel_exchange}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hostelswap_internal

  redis:
    image: redis:7-alpine
    container_name: hostelswap_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hostelswap_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostelswap_prod_backend
    restart: always
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in production .env}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - DATABASE_NAME=${DATABASE_NAME:-hostel_exchange}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - USE_SQLITE=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-RoomSwap Security <noreply@hostel.edu>}
      - INTEGRATION_MOCK_MODE=${INTEGRATION_MOCK_MODE:-True}
    volumes:
      - media_prod_data:/app/media
      - static_prod_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - hostelswap_internal

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostelswap_prod_worker
    restart: always
    command: celery -A config worker -l info --concurrency=4
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DATABASE_NAME=${DATABASE_NAME:-hostel_exchange}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - USE_SQLITE=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hostelswap_internal

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostelswap_prod_beat
    restart: always
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DATABASE_NAME=${DATABASE_NAME:-hostel_exchange}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - USE_SQLITE=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hostelswap_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hostelswap_prod_frontend
    restart: always
    ports:
      - "${PORT:-80}:80"
      - "${SSL_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hostelswap_internal

volumes:
  postgres_prod_data:
  redis_prod_data:
  media_prod_data:
  static_prod_data:

networks:
  hostelswap_internal:
    driver: bridge
